name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Klassische Branch-Veröffentlichung: der gebaute dist/-Ordner wird in den
# Zweig gh-pages gepusht, und GitHub Pages wird per API darauf gestellt.
# Das umgeht die "github-pages"-Umgebung (deren Schutzregel die
# Actions-Veröffentlichung blockiert hat) vollständig.
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Point GitHub Pages at the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if echo "$BODY" | gh api -X PUT "repos/${{ github.repository }}/pages" --input - ; then
            echo "Pages-Quelle auf gh-pages aktualisiert."
          else
            echo "Aktualisierung fehlgeschlagen – Pages neu anlegen…"
            gh api -X DELETE "repos/${{ github.repository }}/pages" || true
            sleep 5
            echo "$BODY" | gh api -X POST "repos/${{ github.repository }}/pages" --input -
          fi
