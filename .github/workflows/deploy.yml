name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Baut beide Apps und legt sie im Zweig gh-pages ab:
#   - Kulturliste  -> Wurzel        (…github.io/AddREADME/)
#   - Bücher-App   -> Unterordner   (…github.io/AddREADME/buecher/)
# GitHub Pages muss (einmalig, bereits erledigt) auf den Zweig gh-pages zeigen.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kulturliste bauen (Wurzel)
        run: |
          npm ci
          npm run build

      - name: Bücher-App bauen (Unterordner /buecher/)
        working-directory: buecher-app
        env:
          GITHUB_PAGES: "1"
        run: |
          npm ci
          npm run build

      - name: Ausgabe zusammenstellen
        run: |
          rm -rf public_site
          mkdir -p public_site
          cp -r dist/. public_site/
          mkdir -p public_site/buecher
          cp -r buecher-app/dist/. public_site/buecher/
          touch public_site/.nojekyll

      - name: Nach gh-pages veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public_site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
