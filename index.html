<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lese-Fortschritt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Mein Lese-Fortschritt</h1>
</header>

<main>
  <form id="add-book-form">
    <input type="text" id="title" placeholder="Buchtitel" required>
    <input type="number" id="totalPages" placeholder="Gesamtseiten" min="1" required>
    <input type="number" id="currentPage" placeholder="Aktuelle Seite" min="0" value="0" required>
    <button type="submit">Buch hinzufügen</button>
  </form>

  <p id="empty-hint" class="hint">Noch keine Bücher hinzugefügt.</p>

  <div id="book-list"></div>
</main>

<script src="app.js"></script>
</body>
</html>
